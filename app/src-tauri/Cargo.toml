[package]
name = "frameling-desktop"
version = "0.1.0"
description = "Frameling desktop app (Tauri 2 shell around the shared Rust engine)"
edition = "2021"
license = "MIT OR Apache-2.0"

# Standalone workspace: the engine workspace builds without desktop system libraries.
[workspace]

[lib]
name = "frameling_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde_json = "1"
frameling-core = { path = "../../crates/core" }
frameling-export = { path = "../../crates/export" }
frameling-tts = { path = "../../crates/tts" }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
