[package]
name = "frameling-tts"
description = "Offline text-to-speech for Frameling: bundled Supertonic 3 neural voices (ONNX), with the OS voices as a fallback."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
unicode-normalization = "0.1"
# ONNX Runtime. The default features download a prebuilt runtime at build time.
ort = "=2.0.0-rc.10"
