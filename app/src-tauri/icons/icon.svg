<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Frameling app icon: a waving stick figure inside a film frame. Original art, CC0. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.55" stop-color="#F2507B"/>
      <stop offset="1" stop-color="#7457FF"/>
    </linearGradient>
    <!-- Cut the sprocket holes out of the frame so the background shows through. -->
    <mask id="holes">
      <rect width="1024" height="1024" fill="#fff"/>
      <g fill="#000">
        <rect x="222" y="232" width="76" height="52" rx="16"/>
        <rect x="358" y="232" width="76" height="52" rx="16"/>
        <rect x="494" y="232" width="76" height="52" rx="16"/>
        <rect x="630" y="232" width="76" height="52" rx="16"/>
        <rect x="766" y="232" width="36" height="52" rx="16"/>
        <rect x="222" y="740" width="76" height="52" rx="16"/>
        <rect x="358" y="740" width="76" height="52" rx="16"/>
        <rect x="494" y="740" width="76" height="52" rx="16"/>
        <rect x="630" y="740" width="76" height="52" rx="16"/>
        <rect x="766" y="740" width="36" height="52" rx="16"/>
      </g>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- Film frame -->
  <rect x="176" y="196" width="672" height="632" rx="72" fill="#FFFFFF" mask="url(#holes)"/>
  <!-- Picture area -->
  <rect x="216" y="310" width="592" height="404" rx="36" fill="#FFF4E8"/>

  <!-- Stick figure, waving -->
  <g fill="none" stroke="#2A1F5C" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M512 468 L512 590"/>
    <path d="M512 590 L462 680"/>
    <path d="M512 590 L566 680"/>
    <path d="M512 506 L440 566"/>
    <path d="M512 506 L586 462 L612 382"/>
  </g>
  <circle cx="512" cy="408" r="48" fill="#2A1F5C"/>
  <!-- Wave marks -->
  <g fill="none" stroke="#F2507B" stroke-width="22" stroke-linecap="round">
    <path d="M660 360 Q680 390 662 422"/>
    <path d="M700 340 Q728 390 702 440"/>
  </g>
</svg>
