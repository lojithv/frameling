name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y espeak-ng
      - run: cargo test --workspace --exclude frameling-wasm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render the demo end to end
        run: |
          cargo run --release -p frameling-cli -- demo demo.frameling
          cargo run --release -p frameling-cli -- render demo.frameling demo.mp4
          ffprobe -v error -count_frames -show_entries stream=nb_read_frames demo.mp4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cd app && npm ci && npm run build && npx svelte-check

  desktop:
    # Builds installers for every OS. Add `ffmpeg` binaries to bundle.resources to ship FFmpeg inside the app.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - run: cd app && npm ci && npm run fetch-tts
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Frameling ${{ github.ref_name }}
          releaseDraft: true
